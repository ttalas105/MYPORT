<section id="work">
  <div class="wrap">
    @for (role of roles; track role.company; let first = $first) {
      <article [class.featured]="first">
        <div class="row">
          <span class="company">{{ role.company }}</span>
          <span class="period">{{ role.period }}</span>
        </div>
        <p class="title">{{ role.title }}</p>
        <p class="line">{{ role.line }}</p>
      </article>
    }
  </div>
</section>
